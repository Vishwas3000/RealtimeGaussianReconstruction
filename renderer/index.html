<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeslaRender replay</title>
<style>
  :root { --bg: #0f1114; --panel: rgba(20, 23, 28, 0.86); --text: #e6e9ee; --muted: #8b939e; --accent: #3d8bff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; }
  .panel { position: fixed; background: var(--panel); border: 1px solid #2a2f37; border-radius: 8px; padding: 10px 12px; }
  #controls { top: 12px; left: 12px; display: grid; gap: 6px; min-width: 250px; max-width: calc(100vw - 24px); }
  #controls .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #controls label { color: var(--muted); }
  select, button { background: #1d2127; color: var(--text); border: 1px solid #343a44; border-radius: 5px; padding: 3px 6px; font: inherit; }
  button { cursor: pointer; min-width: 64px; }
  #stats { top: 12px; right: 12px; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre; }
  #timeline { left: 12px; right: 12px; bottom: 12px; display: flex; gap: 10px; align-items: center; }
  #scrub { flex: 1; accent-color: var(--accent); }
  #time { font: 12px ui-monospace, Consolas, monospace; min-width: 110px; text-align: right; }
  #message { top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 560px; text-align: center; }
  #desc { color: var(--muted); max-width: 320px; }
  .hint { color: var(--muted); font-size: 12px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>

<div id="controls" class="panel">
  <div class="row"><label for="scene">Scene</label><select id="scene"></select></div>
  <div id="desc"></div>
  <div class="row">
    <button id="play">Pause</button>
    <label for="speed">Speed</label>
    <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
    <label for="cam">View</label>
    <select id="cam"><option value="chase" selected>Chase</option><option value="top">Top</option><option value="orbit">Orbit</option></select>
  </div>
  <div class="row">
    <label for="occ">Occupancy</label>
    <select id="occ"><option value="smooth" selected>Static world (smooth)</option><option value="static">Static world (voxels)</option><option value="all">All classes (voxels)</option><option value="off">Off</option></select>
    <label><input type="checkbox" id="camOnly"> camera-visible only</label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="boxes" checked> Objects</label>
    <label><input type="checkbox" id="map" checked> Map</label>
    <label><input type="checkbox" id="path" checked> Path</label>
  </div>
  <div class="hint">Space play/pause · ← → step one perception frame</div>
</div>

<div id="stats" class="panel"></div>

<div id="timeline" class="panel">
  <input type="range" id="scrub" min="0" max="1" step="0.01" value="0">
  <span id="time">0.00 / 0.00 s</span>
</div>

<div id="message" class="panel" hidden></div>

<script type="module" src="./main.js"></script>
</body>
</html>
